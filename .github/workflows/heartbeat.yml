name: Update contribution heartbeat

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/heartbeat.yml'
  pull_request:
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'assets/**'
      - '*.md'
      - '.github/workflows/heartbeat.yml'

permissions:
  contents: read

concurrency:
  group: contribution-heartbeat-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s tests -v

  update:
    needs: validate
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - name: Build the themed SVG
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PROFILE_USERNAME: ${{ github.repository_owner }}
        run: python scripts/build_heartbeat.py --username "$PROFILE_USERNAME"
      - name: Publish changed heartbeat
        run: |
          if git diff --quiet -- assets/heartbeat.svg; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email ''
          git add -- assets/heartbeat.svg
          git commit -m 'chore: refresh contribution heartbeat'
          git push origin HEAD:main
